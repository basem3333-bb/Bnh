<script type="text/plain" id="app-source">
const { useState, useRef } = React;

/* ============================================================
   منطق الاستراتيجية (نفس النسخة المُختبَرة سابقًا — بدون أي تعديل)
   ============================================================ */

function calcIndicators(candles, emaPeriod = 200, rsiPeriod = 14, atrPeriod = 14) {
  const n = candles.length;
  const out = candles.map((c) => ({ ...c }));

  const k = 2 / (emaPeriod + 1);
  out[0].ema = out[0].close;
  for (let i = 1; i < n; i++) out[i].ema = out[i].close * k + out[i - 1].ema * (1 - k);

  const alphaR = 1 / rsiPeriod;
  let avgGain = 0, avgLoss = 0;
  for (let i = 0; i < n; i++) {
    const delta = i === 0 ? 0 : out[i].close - out[i - 1].close;
    const gain = Math.max(delta, 0), loss = Math.max(-delta, 0);
    if (i === 0) { avgGain = gain; avgLoss = loss; }
    else { avgGain = alphaR * gain + (1 - alphaR) * avgGain; avgLoss = alphaR * loss + (1 - alphaR) * avgLoss; }
    if (i < rsiPeriod) { out[i].rsi = 50; continue; }
    if (avgLoss === 0) out[i].rsi = avgGain === 0 ? 50 : 100;
    else { const rs = avgGain / avgLoss; out[i].rsi = 100 - 100 / (1 + rs); }
  }

  const alphaA = 1 / atrPeriod;
  let atrPrev = null;
  const atrArr = [];
  for (let i = 0; i < n; i++) {
    const c = out[i], p = i > 0 ? out[i - 1] : null;
    const tr = p ? Math.max(c.high - c.low, Math.abs(c.high - p.close), Math.abs(c.low - p.close)) : c.high - c.low;
    if (i === 0) atrPrev = tr; else atrPrev = alphaA * tr + (1 - alphaA) * atrPrev;
    out[i].atr = i < atrPeriod - 1 ? NaN : atrPrev;
    atrArr.push(out[i].atr);
  }
  for (let i = 0; i < n; i++) {
    const window_ = atrArr.slice(Math.max(0, i - 49), i + 1).filter((v) => !Number.isNaN(v));
    out[i].atrAvg50 = window_.length >= 10 ? window_.reduce((a, b) => a + b, 0) / window_.length : NaN;
  }
  return out;
}

const bodyOf = (c) => Math.abs(c.close - c.open);
const rangeOf = (c) => c.high - c.low;
const isStrongBody = (c, minPct = 0.6) => { const r = rangeOf(c); return r > 0 && bodyOf(c) / r >= minPct; };

const isBullishEngulfing = (prev, curr, minRatio = 1.3) => {
  const prevBear = prev.close < prev.open, currBull = curr.close > curr.open;
  const engulfs = curr.open <= prev.close && curr.close >= prev.open;
  const sizeOk = bodyOf(prev) > 0 && bodyOf(curr) >= minRatio * bodyOf(prev);
  return prevBear && currBull && engulfs && sizeOk;
};
const isBearishEngulfing = (prev, curr, minRatio = 1.3) => {
  const prevBull = prev.close > prev.open, currBear = curr.close < curr.open;
  const engulfs = curr.open >= prev.close && curr.close <= prev.open;
  const sizeOk = bodyOf(prev) > 0 && bodyOf(curr) >= minRatio * bodyOf(prev);
  return prevBull && currBear && engulfs && sizeOk;
};
const isHammer = (c, wickRatio = 2.0, oppMax = 0.3) => {
  const b = bodyOf(c); if (b === 0) return false;
  const lower = Math.min(c.open, c.close) - c.low, upper = c.high - Math.max(c.open, c.close);
  return lower >= wickRatio * b && upper <= oppMax * b;
};
const isShootingStar = (c, wickRatio = 2.0, oppMax = 0.3) => {
  const b = bodyOf(c); if (b === 0) return false;
  const upper = c.high - Math.max(c.open, c.close), lower = Math.min(c.open, c.close) - c.low;
  return upper >= wickRatio * b && lower <= oppMax * b;
};

function findZones(candles, direction, baseMax = 3, baseBodyPct = 0.3, impulseAtrMult = 1.5) {
  const zones = [];
  for (let i = baseMax + 1; i < candles.length; i++) {
    const impulse = candles[i];
    if (Number.isNaN(impulse.atr)) continue;
    const isImpulse = direction === 'demand' ? impulse.close > impulse.open : impulse.close < impulse.open;
    if (!isImpulse || bodyOf(impulse) < impulseAtrMult * impulse.atr) continue;
    const baseEnd = i - 1;
    let baseStart = baseEnd;
    for (let j = baseEnd; j >= Math.max(baseEnd - baseMax, 0); j--) {
      const c = candles[j], r = rangeOf(c);
      if (r > 0 && bodyOf(c) / r <= baseBodyPct) baseStart = j; else break;
    }
    const baseCandle = candles[baseEnd], rng = rangeOf(baseCandle);
    if (rng === 0 || bodyOf(baseCandle) / rng > baseBodyPct) continue;
    let zoneLow = Infinity, zoneHigh = -Infinity;
    for (let j = baseStart; j <= baseEnd; j++) { zoneLow = Math.min(zoneLow, candles[j].low); zoneHigh = Math.max(zoneHigh, candles[j].high); }
    zones.push({ type: direction, endIdx: baseEnd, zoneLow, zoneHigh });
  }
  return zones;
}

const atrFilterOk = (c, min = 0.75, max = 2.0) => {
  if (Number.isNaN(c.atrAvg50) || c.atrAvg50 === 0) return false;
  const ratio = c.atr / c.atrAvg50;
  return ratio >= min && ratio <= max;
};

function generateSignal(candles, i, demandZones, supplyZones, opts = {}) {
  const { rsiBullMin = 50, rsiBearMax = 50, atrMin = 0.75, atrMax = 2.0 } = opts;
  if (i < 1 || Number.isNaN(candles[i].ema)) return null;
  const row = candles[i], prev = candles[i - 1];
  if (!atrFilterOk(row, atrMin, atrMax)) return null;
  if (row.close > row.ema) {
    const zone = demandZones.find((z) => z.endIdx < i && row.low >= z.zoneLow && row.low <= z.zoneHigh);
    if (zone) {
      const patternOk = isStrongBody(row) && (isBullishEngulfing(prev, row) || isHammer(row));
      const rsiOk = row.rsi > rsiBullMin || row.rsi > prev.rsi;
      if (patternOk && rsiOk) return 'CALL';
    }
  }
  if (row.close < row.ema) {
    const zone = supplyZones.find((z) => z.endIdx < i && row.high >= z.zoneLow && row.high <= z.zoneHigh);
    if (zone) {
      const patternOk = isStrongBody(row) && (isBearishEngulfing(prev, row) || isShootingStar(row));
      const rsiOk = row.rsi < rsiBearMax || row.rsi < prev.rsi;
      if (patternOk && rsiOk) return 'PUT';
    }
  }
  return null;
}

/* ============================================================
   طبقة الاتصال بـ Deriv API الرسمي (بيانات سوقية فقط، بدون تسجيل دخول)
   ============================================================ */

function DerivFeed(appId, granularitySec, cb) {
  this.appId = appId;
  this.granularity = granularitySec;
  this.cb = cb;
  this.ws = null;
  this.symbols = [];
  this.candles = {};
  this.reqIdToSymbol = {};
  this.nextReqId = 1;
}

DerivFeed.prototype.connect = function () {
  this.cb.onStatus('connecting');
  try {
    this.ws = new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=' + this.appId);
  } catch (e) {
    this.cb.onError('تعذّر إنشاء اتصال WebSocket: ' + e.message);
    this.cb.onStatus('error');
    return;
  }
  const self = this;
  this.ws.onopen = function () {
    self.cb.onStatus('connected');
    self.send({ active_symbols: 'brief' });
  };
  this.ws.onmessage = function (evt) {
    let msg;
    try { msg = JSON.parse(evt.data); } catch (e) { self.cb.onError('رسالة غير مفهومة من الخادم'); return; }
    self.handleMessage(msg);
  };
  this.ws.onerror = function () { self.cb.onError('خطأ اتصال WebSocket — تحقق من app_id أو الشبكة'); };
  this.ws.onclose = function () { self.cb.onStatus('disconnected'); };
};

DerivFeed.prototype.disconnect = function () {
  if (this.ws) { try { this.ws.close(); } catch (e) {} this.ws = null; }
};

DerivFeed.prototype.send = function (obj) {
  if (this.ws && this.ws.readyState === WebSocket.OPEN) this.ws.send(JSON.stringify(obj));
};

DerivFeed.prototype.handleMessage = function (msg) {
  this.cb.onDebug(msg.msg_type || (msg.error ? 'error' : 'unknown'));
  if (msg.error) {
    this.cb.onError((msg.error.code ? msg.error.code + ': ' : '') + (msg.error.message || 'خطأ من الخادم'));
    return;
  }
  if (msg.msg_type === 'active_symbols') {
    const all = msg.active_symbols || [];
    const forex = all.filter((s) => String(s.market || '').toLowerCase() === 'forex');
    this.symbols = forex
      .map((s) => ({ symbol: s.underlying_symbol || s.symbol, name: s.underlying_symbol_name || s.display_name || s.underlying_symbol || s.symbol }))
      .filter((s) => s.symbol);
    this.cb.onDebug('active_symbols: استلمنا ' + all.length + ' رمز، ' + forex.length + ' منها forex، ' + this.symbols.length + ' بعد الفلترة النهائية');
    if (this.cb.onRaw) this.cb.onRaw(JSON.stringify(msg).slice(0, 800));
    this.cb.onSymbolsLoaded(this.symbols);
    this.subscribeAll();
    return;
  }
  if (msg.msg_type === 'candles' && msg.req_id != null && this.reqIdToSymbol[msg.req_id]) {
    const symbol = this.reqIdToSymbol[msg.req_id];
    const list = (msg.candles || []).map((c) => ({ time: c.epoch * 1000, open: +c.open, high: +c.high, low: +c.low, close: +c.close }));
    this.candles[symbol] = list;
    if (list.length) {
      const last = list[list.length - 1];
      this.cb.onWatchlistUpdate(symbol, last.close, null);
      this.evaluateSymbol(symbol, list.length - 1, true);
    }
    return;
  }
  if (msg.msg_type === 'ohlc' && msg.ohlc) {
    const o = msg.ohlc;
    const symbol = o.symbol || o.underlying;
    if (!symbol || !this.candles[symbol]) return;
    const arr = this.candles[symbol];
    const epochMs = (Number(o.open_time || o.epoch) || 0) * 1000;
    const updated = { time: epochMs, open: +o.open, high: +o.high, low: +o.low, close: +o.close };
    const last = arr[arr.length - 1];
    if (last && last.time === epochMs) {
      arr[arr.length - 1] = updated;
      this.cb.onWatchlistUpdate(symbol, updated.close, updated.close >= updated.open ? 'up' : 'down');
    } else {
      arr.push(updated);
      if (arr.length > 400) arr.shift();
      this.cb.onWatchlistUpdate(symbol, updated.close, updated.close >= updated.open ? 'up' : 'down');
      this.evaluateSymbol(symbol, arr.length - 2, false);
    }
  }
};

DerivFeed.prototype.evaluateSymbol = function (symbol, closedIdx, isInitialLoad) {
  const arr = this.candles[symbol];
  if (!arr || closedIdx < 200 || closedIdx >= arr.length) return;
  const withInd = calcIndicators(arr, 200, 14, 14);
  const demandZones = findZones(withInd, 'demand');
  const supplyZones = findZones(withInd, 'supply');
  const side = generateSignal(withInd, closedIdx, demandZones, supplyZones, {});
  if (side && !isInitialLoad) {
    const c = arr[closedIdx];
    const name = (this.symbols.filter((s) => s.symbol === symbol)[0] || {}).name || symbol;
    this.cb.onSignal(symbol, name, side, c.close, c.time);
  }
};

DerivFeed.prototype.subscribeAll = function () {
  const self = this;
  this.symbols.forEach(function (s, idx) {
    setTimeout(function () { self.subscribeSymbol(s.symbol); }, idx * 250);
  });
};

DerivFeed.prototype.subscribeSymbol = function (symbol) {
  const reqId = this.nextReqId++;
  this.reqIdToSymbol[reqId] = symbol;
  const nowSec = Math.floor(Date.now() / 1000);
  this.send({
    ticks_history: symbol,
    adjust_start_time: 1,
    end: 'latest',
    start: nowSec - this.granularity * 320,
    style: 'candles',
    granularity: this.granularity,
    count: 300,
    subscribe: 1,
    req_id: reqId,
  });
};

/* ============================================================
   مكوّنات واجهة صغيرة
   ============================================================ */

function Num({ value, decimals = 2, sign = false }) {
  const n = Number(value);
  if (!Number.isFinite(n)) return <span className="num">—</span>;
  const formatted = n.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  const s = sign && n > 0 ? `+${formatted}` : formatted;
  return <span className="num">{s}</span>;
}

function StatusDot({ status }) {
  const color = status === 'connected' ? 'var(--gain)' : status === 'connecting' ? 'var(--amber)' : status === 'error' ? 'var(--loss)' : 'var(--text-dim)';
  const label = { connected: 'متصل', connecting: 'جاري الاتصال...', error: 'خطأ', disconnected: 'منقطع', idle: 'غير متصل' }[status] || status;
  return (
    <div className="flex items-center gap-2">
      <span className={"inline-block rounded-full " + (status === 'connecting' ? 'pulse' : '')} style={{ width: 8, height: 8, background: color }} />
      <span className="text-sm" style={{ color: 'var(--text-dim)' }}>{label}</span>
    </div>
  );
}

/* ============================================================
   التطبيق الرئيسي
   ============================================================ */

function ForexScannerApp() {
  const [status, setStatus] = useState('idle');
  const [appId, setAppId] = useState('1089');
  const [granularity, setGranularity] = useState(300);
  const [symbolCount, setSymbolCount] = useState(0);
  const [watchlist, setWatchlist] = useState({});
  const [alerts, setAlerts] = useState([]);
  const [debugCounts, setDebugCounts] = useState({});
  const [errors, setErrors] = useState([]);
  const [rawSample, setRawSample] = useState('');
  const [showDebug, setShowDebug] = useState(false);
  const feedRef = useRef(null);
  const audioCtxRef = useRef(null);

  const playBeep = () => {
    try {
      const ctx = audioCtxRef.current;
      if (!ctx) return;
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
      osc.start(); osc.stop(ctx.currentTime + 0.35);
    } catch (e) {}
  };

  const handleConnect = () => {
    setAlerts([]); setErrors([]); setWatchlist({}); setDebugCounts({}); setSymbolCount(0);
    try { audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}

    const feed = new DerivFeed(appId || '1089', granularity, {
      onStatus: setStatus,
      onSymbolsLoaded: (list) => setSymbolCount(list.length),
      onWatchlistUpdate: (symbol, price, trend) => {
        setWatchlist((prev) => {
          const existing = prev[symbol];
          const name = (feed.symbols.filter((s) => s.symbol === symbol)[0] || {}).name || symbol;
          return { ...prev, [symbol]: { name, price, trend: trend || (existing && existing.trend) || null, time: Date.now() } };
        });
      },
      onSignal: (symbol, name, side, price, time) => {
        setAlerts((prev) => [{ symbol, name, side, price, time }, ...prev].slice(0, 100));
        playBeep();
      },
      onDebug: (type) => setDebugCounts((prev) => ({ ...prev, [type]: (prev[type] || 0) + 1 })),
      onRaw: (text) => setRawSample(text),
      onError: (msg) => setErrors((prev) => [{ msg, time: Date.now() }, ...prev].slice(0, 20)),
    });
    feedRef.current = feed;
    feed.connect();
  };

  const handleDisconnect = () => {
    if (feedRef.current) feedRef.current.disconnect();
    setStatus('idle');
  };

  const isLive = status === 'connected' || status === 'connecting';
  const watchArr = Object.keys(watchlist).map((k) => ({ symbol: k, ...watchlist[k] })).sort((a, b) => a.symbol.localeCompare(b.symbol));

  return (
    <div dir="rtl" className="min-h-screen w-full" style={{ background: 'var(--bg)', color: 'var(--text)' }}>
      <div className="max-w-md mx-auto px-4 pb-16">
        <div className="pt-6 pb-4 border-b" style={{ borderColor: 'var(--rule)' }}>
          <div className="text-xs uppercase tracking-widest" style={{ color: 'var(--amber)' }}>ماسح إشارات مباشر</div>
          <h1 className="text-2xl font-bold mt-1">فوركس — Deriv</h1>
          <div className="mt-2"><StatusDot status={status} /></div>
        </div>

        {!isLive && (
          <div className="py-5 border-b" style={{ borderColor: 'var(--rule)' }}>
            <div className="text-xs uppercase tracking-widest mb-3" style={{ color: 'var(--text-dim)' }}>الإعدادات</div>
            <label className="block mb-3">
              <div className="text-xs mb-1" style={{ color: 'var(--text-dim)' }}>App ID (اتركه كما هو للتجربة)</div>
              <input type="text" value={appId} onChange={(e) => setAppId(e.target.value)}
                className="num w-full bg-transparent px-3 py-2 text-sm outline-none"
                style={{ background: 'var(--surface-2)', border: '1px solid var(--rule)', borderRadius: 4, color: 'var(--text)' }} />
            </label>
            <div className="text-xs mb-1" style={{ color: 'var(--text-dim)' }}>الفريم الزمني</div>
            <div className="flex gap-2 mb-1">
              {[['M1', 60], ['M5', 300]].map(([label, sec]) => (
                <button key={sec} onClick={() => setGranularity(sec)}
                  className="btn-outline flex-1 py-2 text-sm"
                  style={{
                    background: granularity === sec ? 'var(--amber)' : 'var(--surface)',
                    color: granularity === sec ? '#171308' : 'var(--text)',
                    border: '1px solid var(--rule)', borderRadius: 4, fontWeight: 600,
                  }}>{label}</button>
              ))}
            </div>
            <div className="text-xs mt-3" style={{ color: 'var(--text-dim)' }}>
              يراقب كل أزواج الفوركس المتاحة على Deriv تلقائيًا — بيانات سوقية عامة، بدون تسجيل دخول أو رمز API.
            </div>
          </div>
        )}

        <div className="py-5 border-b" style={{ borderColor: 'var(--rule)' }}>
          <button
            onClick={isLive ? handleDisconnect : handleConnect}
            className="btn-primary w-full flex items-center justify-center gap-2 py-3 text-sm font-semibold"
            style={{
              background: isLive ? 'var(--surface-2)' : 'var(--amber)',
              color: isLive ? 'var(--text)' : '#171308',
              border: isLive ? '1px solid var(--rule)' : 'none',
              borderRadius: 4,
            }}>
            {isLive ? 'قطع الاتصال' : 'اتصال ومراقبة'}
          </button>
          {isLive && (
            <div className="text-xs mt-2 text-center" style={{ color: 'var(--text-dim)' }}>
              يراقب <Num value={symbolCount} decimals={0} /> زوج فوركس
            </div>
          )}
        </div>

        <div className="py-5 border-b" style={{ borderColor: 'var(--rule)' }}>
          <div className="text-xs uppercase tracking-widest mb-3" style={{ color: 'var(--text-dim)' }}>التنبيهات</div>
          {alerts.length === 0 && (
            <div className="text-sm py-6 text-center" style={{ color: 'var(--text-dim)', border: '1px dashed var(--rule)', borderRadius: 4 }}>
              لا تنبيهات بعد. لما تظهر إشارة مطابقة للشروط بتنبعث نغمة وتظهر هنا فورًا.
            </div>
          )}
          {alerts.length > 0 && (
            <div className="overflow-y-auto" style={{ maxHeight: 320, border: '1px solid var(--rule)', borderRadius: 4 }}>
              {alerts.map((a, idx) => (
                <div key={idx} className="px-3 py-2 flex items-center justify-between" style={{ borderBottom: '1px solid var(--rule)' }}>
                  <div>
                    <div className="text-sm font-semibold" style={{ color: a.side === 'CALL' ? 'var(--gain)' : 'var(--loss)' }}>
                      {a.side} — {a.name}
                    </div>
                    <div className="text-xs" style={{ color: 'var(--text-dim)' }}>{new Date(a.time).toLocaleTimeString('ar-EG')}</div>
                  </div>
                  <div className="text-sm"><Num value={a.price} decimals={5} /></div>
                </div>
              ))}
            </div>
          )}
        </div>

        {isLive && (
          <div className="py-5 border-b" style={{ borderColor: 'var(--rule)' }}>
            <div className="text-xs uppercase tracking-widest mb-3" style={{ color: 'var(--text-dim)' }}>قائمة المراقبة</div>
            {watchArr.length === 0 && <div className="text-xs" style={{ color: 'var(--text-dim)' }}>بانتظار أول بيانات...</div>}
            <div className="overflow-y-auto" style={{ maxHeight: 280, border: '1px solid var(--rule)', borderRadius: 4 }}>
              {watchArr.map((w) => (
                <div key={w.symbol} className="px-3 py-1.5 flex items-center justify-between text-xs" style={{ borderBottom: '1px solid var(--rule)' }}>
                  <span style={{ color: 'var(--text-dim)' }}>{w.name}</span>
                  <span style={{ color: w.trend === 'up' ? 'var(--gain)' : w.trend === 'down' ? 'var(--loss)' : 'var(--text)' }}>
                    <Num value={w.price} decimals={5} />
                  </span>
                </div>
              ))}
            </div>
          </div>
        )}

        <div className="py-5">
          <button onClick={() => setShowDebug((v) => !v)} className="text-xs" style={{ color: 'var(--text-dim)' }}>
            {showDebug ? '▲ إخفاء السجل التشخيصي' : '▼ عرض السجل التشخيصي (لو صار خلل)'}
          </button>
          {showDebug && (
            <div className="mt-3 text-xs" style={{ color: 'var(--text-dim)' }}>
              <div className="mb-2">أنواع الرسائل المستلمة:</div>
              <div className="mb-3">
                {Object.keys(debugCounts).length === 0 && <div>لا شيء بعد</div>}
                {Object.keys(debugCounts).map((k) => (
                  <div key={k} className="num">{k}: {debugCounts[k]}</div>
                ))}
              </div>
              <div className="mb-2">آخر رد خام من active_symbols (كامل بدون تفسير):</div>
              <div className="num mb-3" style={{ wordBreak: 'break-all', whiteSpace: 'pre-wrap', color: 'var(--text)', fontSize: 10 }}>
                {rawSample || 'لا شيء بعد'}
              </div>
              <div className="mb-2">الأخطاء:</div>
              {errors.length === 0 && <div>لا أخطاء</div>}
              {errors.map((e, idx) => (
                <div key={idx} style={{ color: 'var(--loss)' }} className="mb-1">{e.msg}</div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

  ReactDOM.createRoot(document.getElementById('root')).render(<ForexScannerApp />);
